name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS Release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version && xcodebuild -list -project mPlayer.xcodeproj

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild \
            -project mPlayer.xcodeproj \
            -scheme mPlayer \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: mPlayer.app
          path: DerivedData/Build/Products/Release/mPlayer.app
          if-no-files-found: error
